  <script>
  "use strict";
  (function () {
    var DATA_URL = './ev-registrations.json';

    /* ---------- helpers（元コンポーネントの算出ロジックを移植） ---------- */
    var el = document.getElementById('app');
    var fmt = function (n) { return Number(n).toLocaleString('en-US'); };
    var sum = function (o) { return Object.keys(o).reduce(function (a, k) { return a + o[k]; }, 0); };
    var pct1 = function (a, b) { return b ? (a / b) * 100 : 0; };
    var signed = function (v, d) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d); };
    var ratio = function (a, b) { return b ? (a / b).toFixed(1) : '—'; };
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };

    /* 最大剰余法で合計をちょうど100にする */
    function to100(items) {
      var t = items.reduce(function (a, i) { return a + i.v; }, 0) || 1;
      var raw = items.map(function (i) { return Object.assign({}, i, { exact: (i.v / t) * 100 }); });
      var out = raw.map(function (i) { return Object.assign({}, i, { pct: Math.floor(i.exact) }); });
      var rest = 100 - out.reduce(function (a, i) { return a + i.pct; }, 0);
      raw.map(function (i, idx) { return { idx: idx, f: i.exact - Math.floor(i.exact) }; })
        .sort(function (a, b) { return b.f - a.f; })
        .forEach(function (r) { if (rest > 0) { out[r.idx].pct += 1; rest -= 1; } });
      return out;
    }

    var DATA = null, YRS = [], LATEST = 0, PREV_FULL = 0;
    var isPartial = function (y) { return !!(DATA && DATA.partial[y]); };
    var totalOf = function (y) { return sum(DATA.years[y]); };
    var periodOf = function (yr) { return isPartial(yr) ? yr + '年' + DATA.partial[yr] : yr + '年'; };

    function hydrate(d) {
      var latestMonthYear = Object.keys(d.months || {}).sort().pop();
      DATA = {
        updated: d.meta.updated,
        trendMax: d.meta.trendMax,
        sourceDetail: d.meta.sourceDetail,
        sourceUrl: d.meta.sourceUrl,
        source: d.meta.source,
        note: d.meta.note,
        partial: Object.keys(d.partial || {}).reduce(function (a, y) { a[y] = d.partial[y].label; return a; }, {}),
        makers: d.makers,
        years: d.years,
        trendSeries: d.display.trendSeries,
        monthlyOrder: d.display.monthlyOrder,
        monthlyYear: latestMonthYear,
        months2026: (d.months && d.months[latestMonthYear]) || []
      };
      YRS = Object.keys(DATA.years).sort();
      LATEST = Number(YRS[YRS.length - 1]);
      PREV_FULL = LATEST - 1;
    }

    /* ---------- state ---------- */
    var state = { year: 0, seen: {} };

    /* ==========================================================
       静的（年に依存しない）セクションの組み立て
       ========================================================== */
    function buildShell() {
      var L = DATA.years[LATEST], P = DATA.years[PREV_FULL];
      var domLatest = totalOf(LATEST) - L.import;
      var domPrev = totalOf(PREV_FULL) - P.import;

      /* --- KPIs --- */
      var kpis = [
        { label: '登録BEV（' + periodOf(LATEST) + '）', value: totalOf(LATEST), decimals: 0, unit: '台', color: '#eef2f7',
          sub: PREV_FULL + '年通年の ' + ratio(totalOf(LATEST), totalOf(PREV_FULL)) + '倍' },
        { label: 'トヨタのBEV', value: L.toyota, decimals: 0, unit: '台', color: '#5aa9ff',
          sub: PREV_FULL + '年通年の ' + ratio(L.toyota, P.toyota) + '倍' },
        { label: '輸入車の比率', value: Number(pct1(L.import, totalOf(LATEST)).toFixed(1)), decimals: 1, unit: '%', color: '#e8503a',
          sub: PREV_FULL + '年は ' + pct1(P.import, totalOf(PREV_FULL)).toFixed(1) + '%' },
        { label: '国産メーカー計', value: domLatest, decimals: 0, unit: '台', color: '#3ddc97',
          sub: PREV_FULL + '年通年の ' + ratio(domLatest, domPrev) + '倍' }
      ];
      var kpiHtml = kpis.map(function (k) {
        return '<div data-anim="up" style="opacity:0;background:#0b0f15;padding:24px 22px 20px">'
          + '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:11px;letter-spacing:.22em;color:#8b97a8">' + esc(k.label) + '</div>'
          + '<div style="display:flex;align-items:baseline;gap:6px;margin-top:12px;font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:clamp(34px,4vw,52px);line-height:1;color:' + k.color + '">'
          + '<span data-count="' + k.value + '" data-decimals="' + k.decimals + '">0</span>'
          + '<span style="font-size:.42em;font-weight:500;color:#8b97a8">' + esc(k.unit) + '</span></div>'
          + '<div style="margin-top:10px;font-size:12.5px;color:#6f7c8d">' + esc(k.sub) + '</div></div>';
      }).join('');

      /* --- ticker --- */
      var tickerItems = Object.keys(L).filter(function (k) { return L[k] > 0; })
        .sort(function (a, b) { return L[b] - L[a]; })
        .map(function (k) { return DATA.makers[k].short + ' ' + fmt(L[k]) + '台'; });
      tickerItems.push('登録BEV計 ' + fmt(totalOf(LATEST)) + '台');
      tickerItems.push(LATEST + '年' + (DATA.partial[LATEST] || '') + '累計');
      var tickerRun = [];
      for (var r = 0; r < 2; r++) tickerItems.forEach(function (t) { tickerRun.push(t); tickerRun.push('◆'); });
      var tickerHtml = '<div style="display:flex;overflow:hidden;border-bottom:1px solid #1a212b;background:#0b0f15;padding:13px 0;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)">'
        + '<div style="display:flex;gap:40px;padding-right:40px;animation:evMarquee 34s linear infinite;font-family:\'Space Grotesk\',sans-serif;font-size:12px;letter-spacing:.26em;color:#55616f;text-transform:uppercase">'
        + tickerRun.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div></div>';

      /* --- year buttons --- */
      var yearBtns = YRS.map(function (yr) {
        return '<button type="button" data-year="' + yr + '" title="' + esc(periodOf(yr))
          + '" style="padding:9px 15px;border:0;border-radius:999px;cursor:pointer;font-family:\'Space Grotesk\',sans-serif;font-size:13px;transition:all .25s;background:transparent;color:#8b97a8;font-weight:500">'
          + (isPartial(yr) ? yr + '*' : yr) + '</button>';
      }).join('');

      /* --- geometry for charts --- */
      var trendMax = DATA.trendMax;
      var x = function (i) { return 80 + (760 / Math.max(YRS.length - 1, 1)) * i; };
      var y = function (v) { return 340 - (v / trendMax) * 280; };
      var lastIdx = YRS.length - 1;
      var fullIdx = lastIdx - 1;

      /* milestone grid + labels */
      var grid = [];
      for (var v = 0; v <= trendMax; v += 20000) {
        grid.push({ y: y(v).toFixed(1), top: ((y(v) / 350) * 100).toFixed(2) + '%', label: v === 0 ? '0' : (v / 10000) + '万' });
      }
      var xLabels = YRS.map(function (yr, i) {
        return { x: x(i).toFixed(1), label: yr, left: ((x(i) / 1000) * 100).toFixed(2) + '%',
          sub: isPartial(yr) ? (DATA.partial[yr] || '') : '', color: isPartial(yr) ? '#c3ccd8' : '#8b97a8' };
      });

      var ms = (function () {
        var ref = totalOf(PREV_FULL), now = totalOf(LATEST);
        var pts = YRS.slice(0, lastIdx).map(function (yr, i) { return x(i).toFixed(1) + ',' + y(totalOf(yr)).toFixed(1); });
        return {
          d: 'M' + pts.join(' L'),
          dPartial: 'M' + x(fullIdx).toFixed(1) + ',' + y(ref).toFixed(1) + ' L' + x(lastIdx).toFixed(1) + ',' + y(now).toFixed(1),
          cx: x(lastIdx).toFixed(1), cy: y(now).toFixed(1),
          refY: y(ref).toFixed(1), refTop: ((y(ref) / 350) * 100).toFixed(2) + '%',
          refLabel: PREV_FULL + '年 通年 ' + fmt(ref) + '台',
          gapX: x(lastIdx).toFixed(1), gapY1: y(ref).toFixed(1), gapY2: y(now).toFixed(1),
          gapTop: (((y(ref) + y(now)) / 2 / 350) * 100).toFixed(2) + '%',
          gapLabel: '+' + fmt(now - ref) + '台',
          nowTop: ((y(now) / 350) * 100).toFixed(2) + '%', nowLabel: fmt(now) + '台',
          bandX: x(fullIdx).toFixed(1), bandW: (x(lastIdx) - x(fullIdx)).toFixed(1),
          bandY: y(now).toFixed(1), bandH: (y(ref) - y(now)).toFixed(1),
          ratio: ratio(now, ref)
        };
      })();
      var msGapText = fmt(totalOf(LATEST) - totalOf(PREV_FULL)) + '台（'
        + signed(pct1(totalOf(LATEST) - totalOf(PREV_FULL), totalOf(PREV_FULL)), 0) + '%）';

      var gridLines = grid.map(function (g) { return '<line x1="70" x2="855" y1="' + g.y + '" y2="' + g.y + '"></line>'; }).join('');
      var gridLabels = grid.map(function (g) { return '<span style="position:absolute;font-size:13px;color:#55616f;white-space:nowrap;transform:translate(-100%,-50%);left:5.6%;top:' + g.top + '">' + g.label + '</span>'; }).join('');
      var xTicks = xLabels.map(function (t) { return '<line y1="340" y2="348" x1="' + t.x + '" x2="' + t.x + '"></line>'; }).join('');
      var xLabHtml = xLabels.map(function (t) {
        return '<span style="position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;transform:translateX(-50%);top:100%;padding-top:10px;left:' + t.left + '">'
          + '<span style="font-size:clamp(12px,1.5vw,15px);font-weight:500;color:' + t.color + '">' + t.label + '</span>'
          + '<span style="font-size:11.5px;color:#55616f">' + esc(t.sub) + '</span></span>';
      }).join('');

      var milestoneSvg = ''
        + '<svg viewBox="0 0 1000 350" style="display:block;width:100%;height:auto;overflow:visible" role="img" aria-label="登録BEV合計の推移と前年通年水準の比較">'
        + '<g stroke="#1a212b" stroke-width="1">' + gridLines + '</g>'
        + '<line x1="70" x2="855" y1="340.5" y2="340.5" stroke="#394452" stroke-width="1.5"></line>'
        + '<g stroke="#394452" stroke-width="1.5">' + xTicks + '</g>'
        + '<rect fill="rgba(198,242,78,.10)" x="' + ms.bandX + '" y="' + ms.bandY + '" width="' + ms.bandW + '" height="' + ms.bandH + '"></rect>'
        + '<line x1="70" x2="855" stroke="#e8503a" stroke-width="1.5" stroke-dasharray="7 6" y1="' + ms.refY + '" y2="' + ms.refY + '"></line>'
        + '<line stroke="#c6f24e" stroke-width="2" x1="' + ms.gapX + '" x2="' + ms.gapX + '" y1="' + ms.gapY1 + '" y2="' + ms.gapY2 + '"></line>'
        + '<path data-anim="draw" fill="none" stroke="#c6f24e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400" d="' + ms.d + '"></path>'
        + '<path data-anim="fade" fill="none" opacity="0" stroke="#c6f24e" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8" d="' + ms.dPartial + '"></path>'
        + '<circle data-anim="pop" r="9" opacity="0" fill="#c6f24e" stroke="#07090d" stroke-width="3" cx="' + ms.cx + '" cy="' + ms.cy + '"></circle>'
        + '</svg>';
      var milestoneOverlay = ''
        + '<div style="position:absolute;left:0;right:0;top:8px;bottom:clamp(44px,5vw,56px);pointer-events:none;font-family:\'Space Grotesk\',sans-serif">'
        + '<span style="position:absolute;left:7%;top:0;font-size:12px;letter-spacing:.2em;color:#55616f">台</span>'
        + gridLabels
        + '<span style="position:absolute;left:8%;font-size:12.5px;font-weight:700;white-space:nowrap;color:#e8503a;transform:translateY(-140%);top:' + ms.refTop + '">' + esc(ms.refLabel) + '</span>'
        + '<span data-anim="fade" style="position:absolute;opacity:0;left:87.5%;font-size:clamp(13px,1.5vw,17px);font-weight:700;white-space:nowrap;color:#c6f24e;transform:translateY(-50%);top:' + ms.nowTop + '">' + esc(ms.nowLabel) + '</span>'
        + '<span data-anim="fade" style="position:absolute;opacity:0;left:87.5%;font-size:12.5px;font-weight:700;white-space:nowrap;color:#c6f24e;transform:translateY(-50%);top:' + ms.gapTop + '">' + esc(ms.gapLabel) + '</span>'
        + xLabHtml + '</div>';

      /* --- trend chart --- */
      var tMax = 40000;
      var ty = function (v) { return 340 - (v / tMax) * 280; };
      var tGrid = [];
      for (var vv = 0; vv <= tMax; vv += 10000) {
        tGrid.push({ y: ty(vv).toFixed(1), top: ((ty(vv) / 350) * 100).toFixed(2) + '%', label: vv === 0 ? '0' : (vv / 10000) + '万' });
      }
      var series = (function () {
        var raw = DATA.trendSeries.map(function (k) {
          var isTotal = k === 'total';
          var val = function (yr) { return isTotal ? totalOf(yr) : DATA.years[yr][k]; };
          var color = isTotal ? '#c6f24e' : DATA.makers[k].color;
          var last = val(YRS[lastIdx]);
          return {
            name: isTotal ? '登録BEV 合計' : DATA.makers[k].short,
            color: color, width: isTotal ? 5 : 3.5,

            + '<div style="margin-top:14px;font-family:\'Space Grotesk\',sans-serif;letter-spacing:.2em;color:#8b97a8">SOURCE</div><a href="' + esc(DATA.sourceUrl || 'https://www.jada.or.jp/pages/342/') + '" target="_blank" rel="noopener">' + esc(DATA.source || '一般社団法人日本自動車販売協会連合会「燃料別登録台数」') + '</a> <span>' + esc(DATA.sourceDetail || '') + '</span>'
            + '<div style="margin-top:14px;font-family:\'Space Grotesk\',sans-serif;letter-spacing:.2em;color:#8b97a8">UPDATED</div><span>' + esc(DATA.updated) + '</span>'
          + '</div>'
        + '</div>'
      + '</footer>';

      /* wire up year buttons */
      var btnWrap = document.getElementById('yearBtns');
      btnWrap.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-year]');
        if (!b) return;
        setYear(Number(b.getAttribute('data-year')));
      });
    }

    /* ==========================================================
       年に依存するセクションの（再）描画
       ========================================================== */
    function renderYear() {
      var year = state.year;
      var data = DATA.years[year];
      var total = totalOf(year);
      var prev = DATA.years[year - 1] ? totalOf(year - 1) : null;
      var order = Object.keys(data).sort(function (a, b) { return data[b] - data[a]; });
      var max = data[order[0]] || 1;
      var seen = state.seen;
      var play = function (k) { return seen[k] ? 'running' : 'paused'; };

      /* year buttons active state */
      Array.prototype.forEach.call(document.querySelectorAll('#yearBtns button[data-year]'), function (b) {
        var on = Number(b.getAttribute('data-year')) === year;
        b.style.background = on ? '#c6f24e' : 'transparent';
        b.style.color = on ? '#07090d' : '#8b97a8';
        b.style.fontWeight = on ? '700' : '500';
      });

      /* --- ranking bars --- */
      document.getElementById('rankBars').innerHTML = order.map(function (k, i) {
        var m = DATA.makers[k];
        var w = Math.max((data[k] / max) * 100, data[k] > 0 ? 1.2 : 0).toFixed(1) + '%';
        return '<div style="display:grid;grid-template-columns:minmax(96px,148px) 1fr;align-items:center;gap:clamp(12px,2vw,24px)">'
          + '<div style="display:flex;flex-direction:column;gap:3px;text-align:right"><span style="font-weight:700;font-size:clamp(13px,1.4vw,16px)">' + esc(m.name) + '</span><span style="font-family:\'Space Grotesk\',sans-serif;font-size:11px;letter-spacing:.1em;color:#6f7c8d">' + esc(m.origin) + ' · ' + (i + 1) + '位</span></div>'
          + '<div style="display:flex;align-items:center;gap:14px;min-width:0">'
            + '<div style="flex:1;height:clamp(26px,3.2vw,40px);background:#0e1218;border-radius:2px;overflow:hidden">'
              + '<div style="height:100%;border-radius:2px;transform-origin:left;animation:evGrowX .95s cubic-bezier(.22,1,.36,1) both;transition:width .85s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,' + m.dark + ',' + m.color + ');width:' + w + ';animation-delay:' + (i * 0.06).toFixed(2) + 's;animation-play-state:' + play('rank') + '"></div>'
            + '</div>'
            + '<span style="min-width:76px;font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:clamp(15px,1.8vw,22px);color:' + m.color + '">' + fmt(data[k]) + '</span>'
          + '</div></div>';
      }).join('');

      /* --- year total line --- */
      document.getElementById('yearTotalLine').textContent = periodOf(year) + ' 登録BEV合計 ' + fmt(total) + '台'
        + (isPartial(year) ? '（' + (year - 1) + '年通年の ' + ratio(total, prev) + '倍）'
           : prev ? '（前年比 ' + signed(pct1(total - prev, prev), 1) + '%）' : '');

      /* --- share waffle + legend --- */
      var shareItems = to100(order.map(function (k) { return { v: data[k], name: DATA.makers[k].short, color: DATA.makers[k].color }; }))
        .filter(function (i) { return i.pct > 0; });
      document.getElementById('shareLead').textContent = periodOf(year) + 'に登録された乗用車BEV100台の内訳。'
        + (isPartial(year) ? 'トヨタと日産だけで半分近くを占める。'
           : year >= 2024 ? '輸入車だけで4分の3を超える。'
           : '当時は日産が最大勢力だった。');
      document.getElementById('shareLegend').innerHTML = shareItems.map(function (s) {
        return '<div style="display:flex;align-items:center;gap:12px;font-size:13.5px"><span style="width:12px;height:12px;border-radius:2px;background:' + s.color + '"></span><span style="flex:1;color:#c3ccd8">' + esc(s.name) + '</span><span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700">' + s.pct + '%</span></div>';
      }).join('');
      var waffle = [];
      shareItems.forEach(function (s) { for (var i = 0; i < s.pct; i++) waffle.push(s); });
      document.getElementById('waffle').innerHTML = waffle.map(function (c, i) {
        return '<div title="' + esc(c.name + ' ' + c.pct + '%') + '" style="aspect-ratio:1;border-radius:2px;opacity:0;animation:evPop .55s cubic-bezier(.34,1.56,.64,1) both;background:' + c.color + ';animation-delay:' + (i * 0.014).toFixed(3) + 's;animation-play-state:' + play('share') + '"></div>';
      }).join('');

      /* --- imports bars --- */
      document.getElementById('importBars').innerHTML = YRS.map(function (yr, i) {
        var p = pct1(DATA.years[yr].import, totalOf(yr));
        var on = Number(yr) === year;
        var color = on ? '#e8503a' : '#6f7c8d';
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end">'
          + '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:clamp(14px,1.8vw,21px);color:' + color + '">' + p.toFixed(0) + '%</span>'
          + '<div style="width:100%;border-radius:2px;transform-origin:bottom;animation:evGrowY .95s cubic-bezier(.22,1,.36,1) both;background:linear-gradient(180deg,' + color + ',' + color + '33);height:' + Math.max(p, 1).toFixed(1) + '%;animation-delay:' + (i * 0.07).toFixed(2) + 's;animation-play-state:' + play('imports') + '"></div>'
          + '<span style="font-family:\'Space Grotesk\',sans-serif;font-size:12px;color:#8b97a8">' + (isPartial(yr) ? yr + '*' : yr) + '</span></div>';
      }).join('');

      /* --- domestic list --- */
      var L = DATA.years[LATEST];
      var domLatest = totalOf(LATEST) - L.import;
      document.getElementById('domesticTitle').textContent = '国産メーカーの内訳（' + periodOf(year) + '）';
      document.getElementById('domesticLead').textContent = '輸入車を除いた国産6社。' + periodOf(LATEST) + 'の合計は ' + fmt(domLatest) + '台で、輸入車を上回った。右の数字は前年（2026年は2025年通年）からの増減。';
      var domesticKeys = Object.keys(data).filter(function (k) { return k !== 'import'; }).sort(function (a, b) { return data[b] - data[a]; });
      document.getElementById('domesticList').innerHTML = domesticKeys.map(function (k, i) {
        var p = DATA.years[year - 1] ? DATA.years[year - 1][k] : null;
        return '<div data-anim="up" style="opacity:0;display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:14px;padding:16px 18px;background:#0b0f15">'
          + '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:18px;color:' + (i === 0 ? '#c6f24e' : '#6f7c8d') + '">' + String(i + 1).padStart(2, '0') + '</span>'
          + '<span style="font-size:14.5px">' + esc(DATA.makers[k].name) + '</span>'
          + '<span style="font-family:\'Space Grotesk\',sans-serif;font-size:12px;color:#55616f;min-width:60px;text-align:right">' + (p == null ? '—' : signed(data[k] - p, 0)) + '</span>'
          + '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:17px;min-width:56px;text-align:right">' + fmt(data[k]) + '</span></div>';
      }).join('');

      /* newly injected data-anim nodes need observing */
      observeNewAnims();
    }

    function setYear(yr) {
      if (yr === state.year) return;
      state.year = yr;
      renderYear();
    }

    /* ==========================================================
       アニメーション（IntersectionObserver）
       ========================================================== */
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var idxCounter = {};
    var animIO, secIO;

    function countUp(node) {
      var to = parseFloat(node.getAttribute('data-count'));
      var dec = parseInt(node.getAttribute('data-decimals') || '0', 10);
      var out = function (v) { return dec > 0 ? v.toFixed(dec) : fmt(Math.round(v)); };
      if (reduce) { node.textContent = out(to); return; }
      var t0 = performance.now();
      (function step(t) {
        var p = Math.min((t - t0) / 1500, 1), e = 1 - Math.pow(1 - p, 3);
        node.textContent = out(to * e);
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    }

    function playAnim(node) {
      if (node.dataset.played) return;
      node.dataset.played = '1';
      if (node.hasAttribute('data-count')) return countUp(node);
      if (node.hasAttribute('data-grow')) {
        if (reduce) { node.style.transform = 'none'; return; }
        node.style.animation = 'evGrowY .8s cubic-bezier(.22,1,.36,1) var(--d,0s) both';
        return;
      }
      var kind = node.getAttribute('data-anim');
      if (reduce) { node.style.opacity = 1; node.style.transform = 'none'; node.style.strokeDashoffset = 0; return; }
      var i = idxCounter[kind] || 0; idxCounter[kind] = i + 1;
      var d = Math.min(i * 0.045, 0.9);
      if (kind === 'up') node.style.animation = 'evFadeUp .85s cubic-bezier(.22,1,.36,1) ' + d + 's both';
      else if (kind === 'fade') node.style.animation = 'evFade .9s ease 1.1s both';
      else if (kind === 'pop') node.style.animation = 'evPop .55s cubic-bezier(.34,1.56,.64,1) ' + (d + 0.1) + 's both';
      else if (kind === 'draw') node.style.animation = 'evDraw 1.7s ease-out ' + d + 's both';
    }

    function observeNewAnims() {
      if (!animIO) return;
      Array.prototype.forEach.call(el.querySelectorAll('[data-anim]:not([data-played]),[data-grow]:not([data-played]),[data-count]:not([data-played])'), function (n) {
        if (reduce) { playAnim(n); } else { animIO.observe(n); }
      });
    }

    function initAnim() {
      var secs = Array.prototype.slice.call(el.querySelectorAll('[data-sec]'));
      if (reduce) {
        var all = {}; secs.forEach(function (s) { all[s.getAttribute('data-sec')] = true; });
        state.seen = all;
        Array.prototype.forEach.call(el.querySelectorAll('[data-anim],[data-grow],[data-count]'), playAnim);
        renderYear();
        return;
      }
      /* section-level "seen" flags drive bar/waffle play-state on re-render */
      secIO = new IntersectionObserver(function (entries) {
        var hit = entries.filter(function (e) { return e.isIntersecting; }).map(function (e) { return e.target.getAttribute('data-sec'); });
        if (!hit.length) return;
        entries.forEach(function (e) { if (e.isIntersecting) secIO.unobserve(e.target); });
        hit.forEach(function (k) { state.seen[k] = true; });
        /* flip any already-rendered paused elements to running */
        Array.prototype.forEach.call(el.querySelectorAll('[style*="animation-play-state:paused"]'), function (n) {
          n.style.animationPlayState = 'running';
        });
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
      secs.forEach(function (s) { secIO.observe(s); });

      animIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { playAnim(en.target); animIO.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
      observeNewAnims();

      /* safety net for environments where IO never fires */
      setTimeout(function () {
        Array.prototype.forEach.call(el.querySelectorAll('[data-anim]:not([data-played]),[data-grow]:not([data-played]),[data-count]:not([data-played])'), function (n) {
          var r = n.getBoundingClientRect();
          if (r.top < window.innerHeight && r.bottom > 0) playAnim(n);
        });
      }, 1800);
    }

    /* ==========================================================
       起動：外部JSONを取りにいき、失敗したら埋め込みへフォールバック
       ========================================================== */
    function start(d) {
      hydrate(d);
      state.year = LATEST;
      buildShell();
      renderYear();
      document.getElementById('boot').classList.add('hide');
      requestAnimationFrame(initAnim);
    }

    function fromFallback(reason) {
      try {
        var raw = document.getElementById('ev-data-fallback').textContent.trim();
        if (!raw || raw.indexOf('__EV_DATA') === 0) throw new Error('no embedded data');
        start(JSON.parse(raw));
      } catch (e) {
        var boot = document.getElementById('boot');
        boot.innerHTML = '<div style="max-width:60ch;text-align:center;line-height:1.9;letter-spacing:normal">'
          + 'データの読み込みに失敗しました（' + esc(reason) + '）。<br>'
          + 'ev-registrations.json が index.html と同じ場所にあるか確認してください。'
          + 'ローカルで確認する場合はHTTPサーバー越しに開く必要があります（file:// では読み込めません）。</div>';
      }
    }

    fetch(DATA_URL + '?v=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(start)
      .catch(function (e) { fromFallback(e.message || 'fetch error'); });
  })();
  </script>
</body>
</html>
